[PHP]
; Production PHP Configuration

; Display Settings
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php/error.log
log_errors_max_len = 1024

; Error Reporting
error_reporting = E_ALL
; Production: Report all errors except deprecated and strict notices
; error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Memory and Limits
memory_limit = 1024M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; Upload Settings
post_max_size = 250M
upload_max_filesize = 250M
upload_tmp_dir = /tmp

; Session Settings
session.name = PHPSESSID
session.save_handler = files
session.save_path = /var/lib/php/sessions
session.use_cookies = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.gc_maxlifetime = 3600
session.gc_probability = 1
session.gc_divisor = 100

; Security Settings
expose_php = Off
default_charset = UTF-8

; File Uploads
file_uploads = On
upload_tmp_dir = /tmp

; Resource Limits
default_socket_timeout = 60
max_file_uploads = 20

; Date and Time
date.timezone = UTC

; Opcache Settings (if enabled)
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=512
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Realpath cache
realpath_cache_size=4096K
realpath_cache_ttl=600

; Performance Tuning
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Cache Settings
; APCu Cache (if extension is enabled)
apc.enabled = 1
apc.enable_cli = 0
apc.shm_size = 256M
apc.ttl = 0
apc.user_ttl = 0
apc.serializer = php
apc.max_file_size = 1M

; Redis Session Handler (if Redis is available)
; Uncomment to use Redis for sessions instead of files
; session.save_handler = redis
; session.save_path = "tcp://redis:6379?prefix=laravel_session_"

; Output Buffering for caching
output_buffering = 4096
